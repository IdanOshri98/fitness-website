<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koach — Reset Password</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:var(--space-5);">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#04201B"/></svg>
      </span>
      <span>Koach<span class="brand-sub" data-i18n="brandSub">Strength, tracked.</span></span>
    </div>

    <h1 data-i18n="resetTitle">Reset your password</h1>

    <div class="auth-message" id="authMessage" hidden></div>

    <form id="resetForm">
      <div class="form-row">
        <label data-i18n="newPasswordLabel">New password</label>
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-row">
        <label data-i18n="confirmPasswordLabel">Confirm new password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary" id="resetSubmitBtn" style="width:100%;margin-top:var(--space-2);" data-i18n="resetPasswordSubmitBtn">Set new password</button>
    </form>

    <a href="login.html" class="auth-back-link" data-i18n="resetBackToLogin">← Back to log in</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="script.js"></script>
<script>
(function () {
  "use strict";
  var form = document.getElementById("resetForm");
  var submitBtn = document.getElementById("resetSubmitBtn");
  var messageEl = document.getElementById("authMessage");
  var hasRecoverySession = false;

  function showMessage(text, isError) {
    messageEl.textContent = text;
    messageEl.hidden = false;
    messageEl.classList.toggle("error", !!isError);
  }

  function lockFormAsInvalid() {
    form.hidden = true;
    showMessage(window.KoachI18n.t("resetInvalidLinkMsg"), true);
  }

  if (!window.sb) {
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(function () { showMessage("Supabase is not configured.", true); form.hidden = true; }, 0);
    });
  } else {
    /* supabase-js parses the recovery token from the URL automatically and
       establishes a temporary "recovery" session — give it a moment, then
       check whether we actually got one before allowing a password change. */
    window.sb.auth.onAuthStateChange(function (event, session) {
      if (event === "PASSWORD_RECOVERY" && session) hasRecoverySession = true;
    });
    setTimeout(function () {
      if (hasRecoverySession) return;
      window.sb.auth.getSession().then(function (res) {
        if (res.data.session) hasRecoverySession = true;
        else lockFormAsInvalid();
      });
    }, 1500);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (!window.sb) return;
    var pw1 = document.getElementById("newPassword").value;
    var pw2 = document.getElementById("confirmPassword").value;
    if (pw1 !== pw2) { showMessage(window.KoachI18n.t("passwordMismatchMsg"), true); return; }

    submitBtn.disabled = true;
    window.sb.auth.updateUser({ password: pw1 }).then(function (res) {
      submitBtn.disabled = false;
      if (res.error) { showMessage(res.error.message, true); return; }
      showMessage(window.KoachI18n.t("resetSuccessMsg"), false);
      setTimeout(function () { location.href = "dashboard.html"; }, 1500);
    });
  });
})();
</script>
</body>
</html>
